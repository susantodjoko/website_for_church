{# Responsive YouTube player. Expects `video_id`, optional `video_title`. #}
<div class="video-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ video_id }}"
          title="{{ video_title|default:'Video YouTube' }}"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
</div>
<p class="video-embed__link">
  <a href="https://www.youtube.com/watch?v={{ video_id }}" target="_blank" rel="noopener">Tonton di YouTube &rarr;</a>
</p>
